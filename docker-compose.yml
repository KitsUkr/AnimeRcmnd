services:
  uaanisubbot:
    build:
      context: .
    container_name: uaanisubbot
    restart: unless-stopped
    image: uaanisubbot:latest
    environment:
      BOT_TOKEN: "${BOT_TOKEN:?задайте BOT_TOKEN}"
      CHANNEL_USERNAME: "${CHANNEL_USERNAME:-}"
      ADMIN_IDS: "${ADMIN_IDS:-}"

      HIKKA_API_BASE: "${HIKKA_API_BASE:-https://api.hikka.io}"
      HIKKA_API_TOKEN: "${HIKKA_API_TOKEN:-}"
      HIKKA_CLIENT_REFERENCE: "${HIKKA_CLIENT_REFERENCE:-}"
      HIKKA_CLIENT_SECRET: "${HIKKA_CLIENT_SECRET:-}"

      DB_POOL_MIN_SIZE: "${DB_POOL_MIN_SIZE:-1}"
      DB_POOL_MAX_SIZE: "${DB_POOL_MAX_SIZE:-10}"

      DATABASE_URL: "postgresql://${POSTGRES_USER:?задайте POSTGRES_USER}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?задайте POSTGRES_DB}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  cloudbeaver_data: